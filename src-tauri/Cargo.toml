[package]
name = "zuychin-council-desktop"
version = "0.1.0"
description = "Council host desktop supervisor"
edition = "2021"
rust-version = "1.88"

[lib]
name = "zuychin_council_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["dynamic-acl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dunce = "1"
process-wrap = { version = "10", default-features = false, features = ["std", "job-object", "process-group", "creation-flags"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
