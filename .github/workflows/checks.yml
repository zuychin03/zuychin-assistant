# All database fixtures live in a disposable Supabase stack on the runner.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: lint, types and offline suites
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows is not redundant here: the host resolves .cmd shims, quotes for
        # cmd.exe, kills process trees and normalises MSYS drive paths, and the
        # singleton lock reads liveness from a pid. All of that is per-platform.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: lint
        if: runner.os == 'Linux'
        run: npm run lint

      - name: types
        if: runner.os == 'Linux'
        run: npx tsc --noEmit

      - name: council protocol, model and git contracts
        run: npm run council:v3:test

      - name: supervision contract and host singleton
        run: npm run council:supervisor:test

      - name: worktree containment
        run: npm run council:paths:test

      - name: service authorisation and input contracts
        run: npm run council:services:test

      - name: launch preflight
        run: npm run council:preflight:test

      - name: host process faults and harness guards
        run: npm run council:fault:options:test

      - name: isolated database environment guards
        run: npm run council:ci:env:test

  database:
    name: suites against isolated Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: start isolated Supabase
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/council-supabase/supabase"
          cp .github/supabase/config.toml "$RUNNER_TEMP/council-supabase/supabase/config.toml"
          supabase start --workdir "$RUNNER_TEMP/council-supabase" > "$RUNNER_TEMP/council-supabase-start.log" 2>&1
          supabase status --workdir "$RUNNER_TEMP/council-supabase" -o json > "$RUNNER_TEMP/council-supabase-status.json"
          npx tsx scripts/prepare-council-ci.mts --status-file "$RUNNER_TEMP/council-supabase-status.json" --output .env.local

      - name: apply the complete schema
        run: |
          set -euo pipefail
          docker exec -i supabase_db_council-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase-setup.sql
          docker exec supabase_db_council-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"

      - name: wait for REST schema readiness
        run: |
          node --env-file=.env.local --input-type=module <<'NODE'
          const base = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const tables = ['council_sessions', 'council_host_leases', 'agent_clients', 'agent_tool_calls'];
          let schemaReady = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            const ready = await Promise.all(tables.map(async (table) => {
              try {
                const response = await fetch(`${base}/rest/v1/${table}?select=*&limit=0`, {
                  headers: { apikey: key, Authorization: `Bearer ${key}` },
                  signal: AbortSignal.timeout(3000), redirect: 'error',
                });
                await response.arrayBuffer();
                return response.ok;
              } catch { return false; }
            }));
            if (ready.every(Boolean)) { schemaReady = true; break; }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          if (!schemaReady) throw new Error('The isolated REST schema did not become ready.');
          NODE

      - name: exact-commit gate
        run: npm run council:schema:check

      - name: agent credentials
        run: npm run agents:test

      - name: council V3 against the database
        run: npm run council:v3:test:db

      - name: council protocol
        run: npm run council:protocol:test

      - name: mutation journal
        run: npm run journal:test

      - name: required mid-turn crash recovery
        shell: bash
        run: |
          set -euo pipefail
          server_log="$RUNNER_TEMP/council-fault-next.log"
          setsid node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3105 > "$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            for attempt in {1..20}; do
              kill -0 -- "-$server_pid" 2>/dev/null || break
              sleep 0.25
            done
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -f "$server_log"
          }
          trap cleanup EXIT
          ready=false
          for attempt in {1..90}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::The isolated Next server exited before readiness."
              exit 1
            fi
            if curl --fail --silent --max-time 3 --output /dev/null http://127.0.0.1:3105/login; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::The isolated Next server did not become ready."
            exit 1
          fi
          npm run council:fault:test -- --require-phase-b --mcp-url http://127.0.0.1:3105/api/mcp/mcp

      - name: stop isolated Supabase
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/council-supabase/supabase/config.toml" ]; then
            supabase stop --workdir "$RUNNER_TEMP/council-supabase" --no-backup
          fi

      - name: remove temporary credentials and logs
        if: always()
        run: rm -f .env.local "$RUNNER_TEMP/council-supabase-status.json" "$RUNNER_TEMP/council-supabase-start.log" "$RUNNER_TEMP/council-fault-next.log"
