# All database fixtures live in a disposable Supabase stack on the runner.
# Node is pinned to an exact version: older runner images resolve 24 to 24.22.2, which crashed V8
# ("jit_page_->allocations_.erase") at the end of the council suites on 18/11/2026.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: lint, types and offline suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.3
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: types
        run: npx tsc --noEmit

      - name: council protocol, seats and execution records
        run: npm run council:v3:test

      - name: policy versions and boundary
        run: npm run council:policy:test

      - name: service authorisation and input contracts
        run: npm run council:services:test

      - name: council runner, seats and reply repair
        run: npm run council:online:test

      - name: isolated database environment guards
        run: npm run council:ci:env:test

      - name: named client migration and credential isolation
        run: npm run agents:offline:test

  assistant:
    name: assistant V6 suites
    # In-memory PGlite and stubbed providers only, so one platform and no secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.3
          cache: npm

      - run: npm ci

      - name: V6 regression suites
        run: npm run v6:test

      # Fake recogniser only, so the service's native dependency is not installed.
      - name: speech-to-text service
        run: npm test --prefix stt-service

      # Fake engine only, so numpy, onnxruntime and the model are not installed. The parity tests skip without the model.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: text-to-speech service
        run: python -m unittest discover -s tts-service/tests -t tts-service

  database:
    name: suites against isolated Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.3
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: start isolated Supabase
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/council-supabase/supabase"
          cp .github/supabase/config.toml "$RUNNER_TEMP/council-supabase/supabase/config.toml"
          supabase start --workdir "$RUNNER_TEMP/council-supabase" > "$RUNNER_TEMP/council-supabase-start.log" 2>&1
          supabase status --workdir "$RUNNER_TEMP/council-supabase" -o json > "$RUNNER_TEMP/council-supabase-status.json"
          npx tsx scripts/prepare-council-ci.mts --status-file "$RUNNER_TEMP/council-supabase-status.json" --output .env.local

      - name: apply the complete schema
        run: |
          set -euo pipefail
          docker exec -i supabase_db_council-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase-setup.sql
          docker exec supabase_db_council-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"

      - name: wait for REST schema readiness
        run: |
          node --env-file=.env.local --input-type=module <<'NODE'
          const base = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const tables = ['council_sessions', 'council_host_leases', 'agent_clients', 'agent_tool_calls'];
          let schemaReady = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            const ready = await Promise.all(tables.map(async (table) => {
              try {
                const response = await fetch(`${base}/rest/v1/${table}?select=*&limit=0`, {
                  headers: { apikey: key, Authorization: `Bearer ${key}` },
                  signal: AbortSignal.timeout(3000), redirect: 'error',
                });
                await response.arrayBuffer();
                return response.ok;
              } catch { return false; }
            }));
            if (ready.every(Boolean)) { schemaReady = true; break; }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          if (!schemaReady) throw new Error('The isolated REST schema did not become ready.');
          NODE

      - name: council schema behaviour
        run: npm run council:schema:check

      - name: agent credentials
        run: npm run agents:test

      - name: atomic credential transaction races
        shell: bash
        run: |
          set -euo pipefail
          claims_container="council-claims-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$claims_container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --network none --name "$claims_container" \
            --env POSTGRES_PASSWORD=disposable-test-only postgres:16-alpine >/dev/null
          ready=false
          for attempt in {1..30}; do
            if docker exec "$claims_container" pg_isready -U postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::The isolated claim-test database did not become ready."
            exit 1
          fi
          npx tsx scripts/test-agent-claim-postgres.mts --container "$claims_container"

      - name: seat credential transaction races
        shell: bash
        run: |
          set -euo pipefail
          seats_container="council-seat-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$seats_container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --network none --name "$seats_container" \
            --env POSTGRES_PASSWORD=disposable-test-only postgres:16-alpine >/dev/null
          ready=false
          for attempt in {1..30}; do
            if docker exec "$seats_container" pg_isready -U postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::The isolated seat-test database did not become ready."
            exit 1
          fi
          npx tsx scripts/test-council-seat-renewal-postgres.mts --container "$seats_container"

      - name: council V3 against the database
        run: npm run council:v3:test:db

      - name: council protocol
        run: npm run council:protocol:test

      - name: mutation journal
        run: npm run journal:test

      - name: stop isolated Supabase
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/council-supabase/supabase/config.toml" ]; then
            supabase stop --workdir "$RUNNER_TEMP/council-supabase" --no-backup
          fi

      - name: remove temporary credentials and logs
        if: always()
        run: rm -f .env.local "$RUNNER_TEMP/council-supabase-status.json" "$RUNNER_TEMP/council-supabase-start.log"
